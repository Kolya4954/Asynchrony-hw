<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <h2>Timer: <span class="span"></span></h2>



    <div class="div"></div>



  <p>ваш рахунок: <span class="rahynok"></span></p> 
    <h2>нажми на: <span class="color"></span> за секунду</h2>
     <button class="start" type="button">почати</button>
     <button class="stop" type="button">зупинити</button>
     <button class="resume" type="button">продовжити</button>
     <ul class="list">
        <li class="item"><button class="btn red" data-color="red"></button></li>
        <li class="item"><button class="btn green" data-color="green"></button></li>
        <li class="item"><button class="btn blue" data-color="blue"></button></li>
     </ul>



     


     <input type="text" class="time" placeholder="введіть час через який з'явиться повідомлення(в сек.)">
      <button type="button" class="startTimout">старт</button>
      <h2 class="message">я появлюсь через декілька секунд</h2>
    
    <script type="module" src="./main.js"></script>
</body>
</html>
